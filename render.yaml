services:
  - type: web
    name: macros-flex
    runtime: node
    plan: free
    rootDir: macro-tracker
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODELS
        value: meta-llama/llama-3.3-70b-instruct:free,deepseek/deepseek-chat-v3-0324:free,qwen/qwen-2.5-72b-instruct:free,google/gemma-3-27b-it:free
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_APP_NAME
        value: Macros Flex
      - key: OPENROUTER_API_KEY
        sync: false
